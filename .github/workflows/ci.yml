name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        # 不装 mlx —— 它只在 Apple Silicon 上能跑。
        # 后处理和 HTTP 层用 mock 后端，任何平台都能完整测试。
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./server[dev]" httpx

      - name: 跑测试
        env:
          MIXDICTATE_BACKEND: mock
          MIXDICTATE_WARMUP: "0"
        run: python -m pytest server/tests -v

  swift:
    name: Swift 编译 (Apple Silicon)
    # macos-14 及以后是 M1 runner，跟目标平台一致
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: swift --version

      - name: 编译
        working-directory: app
        run: swift build -c release

      - name: 打 .app bundle
        run: ./scripts/build_app.sh

      - name: 检查 bundle 结构
        run: |
          test -x build/MixDictate.app/Contents/MacOS/MixDictate
          test -f build/MixDictate.app/Contents/Info.plist
          plutil -lint build/MixDictate.app/Contents/Info.plist
          codesign --verify --verbose build/MixDictate.app

  shell:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
